[package]
name = "stillroom-core"
version = "0.1.0"
edition = "2021"
description = "Stillroom's vault engine for Windows: the same format as the Mac app (docs/FORMAT.md)."
license-file = "../../LICENSE.md"
publish = false
build = "build.rs"

[lib]
# rlib for the tests, cdylib for the WinUI shell to call over FFI.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "stillroom-open"
path = "src/bin/stillroom-open.rs"

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"
encoding_rs = "0.8"
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
hpke = { version = "0.12", default-features = false, features = ["alloc", "x25519"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1", default-features = false, features = ["std", "serde", "v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_ErrorReporting",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
cbindgen = { version = "0.29", default-features = false }
cc = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
cc = "1"

[profile.dev]
# The Argon2 C is built with -O3 by build.rs in every profile. The crypto crates are generic, so AES-GCM and zeroize
# are compiled into this crate at its level: unoptimized, a test that seals a few MiB takes many seconds. Level 1 keeps
# them quick and the engine still easy to step through.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
